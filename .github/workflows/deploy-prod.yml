name: apartment-mcp release to NAS

# main에 push되면 테스트 → 이미지 확인 → NAS로 전송 → mcp·etl 컨테이너 재시작. Actions 탭에서 수동 실행도 된다.
# 필요한 secrets
#   PROD_HOST, PROD_PORT, PROD_USERNAME, PROD_PRIVATE_KEY : NAS SSH 접속
#   SERVICE_ROOT      : NAS 배포 루트. 파일은 ${SERVICE_ROOT}/apartment-mcp에 놓인다
#   MCP_DATABASE_URL  : 읽기 전용 계정 접속 문자열(apartment_mcp)
#   MCP_API_TOKEN     : claude.ai 커넥터가 보내는 토큰(32자 이상)
#   DATABASE_URL      : ETL 쓰기 권한 접속 문자열(etl 컨테이너 전용)
#   SERVICE_KEY       : 공공데이터포털 디코딩 키(etl 컨테이너 전용)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install "httpx>=0.27" "tenacity>=8" "pytest>=8" -r mcp_server/requirements.txt

      # DB가 없으므로 DB 테스트(DATABASE_URL·MCP_DATABASE_URL 필요)는 건너뛰고 파서·API 클라이언트·인증 등만 돈다
      - name: Unit tests
        run: python -m pytest -q

      - name: Build image
        run: docker build -f mcp_server/Dockerfile -t apartment-mcp:ci .

      # 이미지 안 파일(.dockerignore 허용 목록)과 HTTP 인증을 확인한다. tools/list는 DB를 읽지 않는다
      - name: Smoke test image
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint ls apartment-mcp:ci -A /app | tr '\n' ' ')" = "etl mcp_server "
          TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name smoke -p 28001:28001 \
            -e MCP_DATABASE_URL=postgresql://ci@127.0.0.1:1/ci -e MCP_API_TOKEN="$TOKEN" apartment-mcp:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:28001/healthz >/dev/null && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:28001/healthz)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:28001/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:28001/mcp \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')" = 200

      - name: Smoke test logs
        if: failure()
        run: docker logs smoke || true

      # ETL 이미지: 파일이 etl뿐인지, 단계 모듈이 import되는지, 스케줄 계산(DB 접속 없음)
      - name: Build and smoke test ETL image
        run: |
          set -euo pipefail
          docker build -f etl/Dockerfile -t apartment-etl:ci .
          test "$(docker run --rm --entrypoint ls apartment-etl:ci -A /app | tr '\n' ' ')" = "etl "
          docker run --rm apartment-etl:ci python -c "import etl.collect, etl.bldg, etl.refresh, etl.cron"
          docker run --rm apartment-etl:ci python -m etl.cron --plan

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # 컨테이너에 넘길 값만 담는다. compose가 서비스마다 필요한 것만 넘긴다(mcp: MCP 두 값, etl: DATABASE_URL·SERVICE_KEY)
      - name: Set ENV file
        env:
          MCP_DATABASE_URL: ${{ secrets.MCP_DATABASE_URL }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_DATABASE_URL" || { echo "MCP_DATABASE_URL secret이 없다"; exit 1; }
          test ${#MCP_API_TOKEN} -ge 32 || { echo "MCP_API_TOKEN secret이 없거나 32자보다 짧다"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret이 없다"; exit 1; }
          test -n "$SERVICE_KEY" || { echo "SERVICE_KEY secret이 없다"; exit 1; }
          umask 077
          printf 'MCP_DATABASE_URL=%s\nMCP_API_TOKEN=%s\nDATABASE_URL=%s\nSERVICE_KEY=%s\n' \
            "$MCP_DATABASE_URL" "$MCP_API_TOKEN" "$DATABASE_URL" "$SERVICE_KEY" > .env

      - name: Transfer files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT }}
          source: "docker-compose.yml,.dockerignore,.env,mcp_server/*,etl/*"
          target: ${{ format('{0}/apartment-mcp', secrets.SERVICE_ROOT) }}
          overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to NAS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.SERVICE_ROOT }}/apartment-mcp"
            PATH="/var/packages/ContainerManager/target/usr/bin/:$PATH"
            chmod 600 .env
            docker-compose build mcp etl
            docker-compose up -d mcp etl
            docker image prune -f
            ok=""
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:28001/healthz >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "healthz 응답 없음"
              docker-compose logs --tail 50 mcp
              exit 1
            fi
            echo "healthz ok"
            # etl은 포트가 없다. DB 접속을 확인한 스케줄러가 다음 실행 시각을 찍으면 된다
            for i in $(seq 1 30); do
              if docker-compose logs etl 2>/dev/null | grep -q "다음 실행"; then
                docker-compose logs --tail 3 etl
                exit 0
              fi
              sleep 2
            done
            echo "etl 스케줄러가 뜨지 않음"
            docker-compose logs --tail 50 etl
            exit 1
